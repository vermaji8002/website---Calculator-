<!DOCTYPE html>
<html>
  <link rel="manifest" href="manifest.json">
<head>
    <title>My Calculator</title>
  <style>
    * {
        box-sizing: border-box;
    }
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>
  body {
    margin: 0;
    min-height: 100vh;
    background: #eeeeee;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 30px;
    font-size: 42px;
}

.calculator {
    margin: 30px auto;
}

    .calculator {
        width: 330px;
        padding: 20px;
        background: #222;
        border-radius: 25px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    #display {
        width: 100%;
        height: 75px;
        margin-bottom: 18px;
        padding: 10px 15px;
        border: none;
        border-radius: 12px;
        background: #eeeeee;
        font-size: 32px;
        text-align: right;
        outline: none;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }

    button {
        height: 65px;
        border: none;
        border-radius: 15px;
        font-size: 24px;
        cursor: pointer;
        transition: 0.1s;
    }

    button:active {
        transform: scale(0.92);
    }
    /* Calculator buttons */

button {
    background: #f2f2f2;
    color: #111;
}

button:nth-child(4n) {
    background: #ff9500;
    color: white;
}

button:nth-last-child(-n+4) {
    background: #444;
    color: white;
}

button:nth-child(14) {
    background: #ff3b30;
    color: white;
}
    #themeBtn {
    height: 45px;
    padding: 0 20px;
    margin-bottom: 10px;
    border-radius: 20px;
    background: #222;
    color: white;
    font-size: 16px;
}

body.dark {
    background: #111;
    color: white;
}

body.dark .calculator {
    background: #000;
}

body.dark #display {
    background: #333;
    color: white;
}
    #history {
    width: 330px;
    margin: 20px auto;
    padding: 15px;
    background: white;
    border-radius: 15px;
    text-align: left;
}

#history h2 {
    margin-top: 0;
    text-align: center;
}

.history-item {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    font-size: 18px;
}
    #clearHistory {
    width: 100%;
    height: 45px;
    margin-bottom: 10px;
    background: #ff3b30;
    color: white;
    font-size: 16px;
    }
  </style>
</head>

<body>

    <h1>My Calculator</h1>
  <button id="themeBtn">🌙 Dark Mode</button>
<div class="calculator">

    <input type="text" id="display" readonly>

    <div class="buttons">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>÷</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>×</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>−</button>

    <button>0</button>
<button>.</button>
<button>⌫</button>
<button>+</button>

<button>C</button>
<button>%</button>
<button>=</button>
<button>00</button>
    </div>

<div id="history">
    <h2>History</h2>

    <button id="clearHistory">🗑️ Clear History</button>

    <div id="historyList"></div>
</div>
  <script>
    const display = document.getElementById("display");
    const buttons = document.querySelectorAll(".buttons button");

    buttons.forEach(button => {
        button.addEventListener("click", () => {

            const value = button.innerText;

            if (value === "C") {
                display.value = "";
            }
              else if (value === "⌫") {
    display.value = display.value.slice(0, -1);
}

else if (value === "%") {
    display.value = display.value / 100;
}

            else if (value === "=") {
                try {
                    let expression = display.value
                        .replace(/×/g, "*")
                        .replace(/÷/g, "/")
                        .replace(/−/g, "-");

                    display.value = eval(expression);
                  const result = display.value;

const historyList = document.getElementById("historyList");

const item = document.createElement("div");
item.className = "history-item";
item.innerText = expression + " = " + result;

historyList.prepend(item);
                } catch {
                    display.value = "Error";
                }
            }

            else {
                display.value += value;
            }
        });
    });
    const themeBtn = document.getElementById("themeBtn");

themeBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
        themeBtn.innerText = "☀️ Light Mode";
    } else {
        themeBtn.innerText = "🌙 Dark Mode";
    }
});
    const clearHistory = document.getElementById("clearHistory");

clearHistory.addEventListener("click", () => {
    document.getElementById("historyList").innerHTML = "";
});
    document.addEventListener("keydown", function(event) {

    const key = event.key;

    if ("0123456789.+-*/%".includes(key)) {
        display.value += key;
    }

    else if (key === "Enter") {
        document.querySelector(".buttons button:nth-child(19)").click();
    }

    else if (key === "Backspace") {
        display.value = display.value.slice(0, -1);
    }

    else if (key === "Escape") {
        display.value = "";
    }

});
  </script>
</body>
</html>
